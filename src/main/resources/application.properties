
spring.application.name=exif-file-renamer
#prevent directory traversal
spring.profiles.active=local
server.port=8181

image.date.prefix.format=

prefixes.ignorable=m2ts,mts,BDM,XML,BIN,DAT
prefixes.specific.handling=VID_,VID-,IMG_201,IMG-201,IMG_202,IMG-202
prefixes.tobecut=VID_,VID-,IMG-,IMG_

# safe.base.path= ** fill in safe base path to prevent path traversal **
safe.base.path=/Volumes/
debug.reader.print.imagedata=false