<html xmlns:th="https://www.thymeleaf.org" lang="en">

<div class="container text-center flex-box block px-4">
    <div class="row">
        <div class="col">
            <h2>Renaming Results</h2>
            Renamed <span th:if="${results != null}" th:text="${results.totalRenamed}"></span> files in total.
        </div>
    </div>
    <div class="row">
<!--        <div class="col">-->
<!--            <h3>Image Renaming Results Success Log</h3>-->
<!--            <ul th:each="result: ${results.imageRenamingResults}" class="list-group">-->
<!--                <li class="list-group-item"><span th:text="${result.renameSuccessLog}"></span></li>-->
<!--            </ul>-->
<!--        </div>-->
        <div class="col">
            <h3>Total Old vs New</h3>
            <ul th:if="${results != null}" th:each="resultMap: ${results.totalOldvsNew}" class="list-group">
                <li class="list-group-item" th:each="result : ${resultMap}">
                    Renamed <span th:text="${result.key}"> to <span th:text="${result.value}"></span></span>
                </li>
            </ul>
        </div>
        <div class="col">
            <h3>Image Renaming Results Fail Log</h3>
            <ul th:if="${results != null}" th:each="result: ${results.imageRenamingResults}" class="list-group">
                <li class="list-group-item"><span th:text="${result.renameFailLog}"></span></li>
            </ul>
        </div>
    </div>

    <div class="row" th:if="${results != null and !results.specificRenamingResults.isEmpty()}">
        <div class="col-4" >
            <h3>Specific Handling Rename Result Log</h3>
            <ul th:each="result: ${results.specificRenamingResults}" class="list-group">
                <li class="list-group-item"><span th:text="${result.logSpecificSuccess}"></span></li>
            </ul>
        </div>
        <div class="col-4">
            <h3>Specific Handling Rename Result Log</h3>
            <ul th:if="${results != null}" th:each="result: ${results.specificRenamingResults}" class="list-group">
                <li class="list-group-item"><span th:text="${result.logSpecificSuccess}"></span></li>
            </ul>
        </div>
        <div class="col-4">
            <h3>Specific Handling Rename Result Log</h3>
            <ul  th:if="${results != null}" th:each="result: ${results.specificRenamingResults}" class="list-group">
                <li class="list-group-item"><span th:text="${result.oldVSNewVidName}"></span></li>
            </ul>
        </div>
    </div>
</div>
</html>
